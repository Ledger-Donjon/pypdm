[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypdm"
version = "2.1"
description = "Python3 library for controlling Alphanov's PDM laser sources."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { file = "COPYING.LESSER" }
authors = [
  { name = "Olivier Heriveaux" }
]
dependencies = [
  "pyserial"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
# PySide6 6.12.0 corrupts None reference count on Python < 3.12, crashing.
gui = ["PySide6-Essentials!=6.12.0"]

[project.scripts]
pypdm-gui = "pypdm.gui:main"

[project.urls]
Homepage = "https://github.com/Ledger-Donjon/pypdm"
Repository = "https://github.com/Ledger-Donjon/pypdm"
Documentation = "https://pypdm.readthedocs.io"

[tool.setuptools.packages.find]
where = ["."]
include = ["pypdm*"]

[tool.setuptools.package-data]
"pypdm" = ["py.typed"]

